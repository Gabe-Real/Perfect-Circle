<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;width:240px;background:#121212;color:#f2f2f2}
  .wrap{padding:14px;display:grid;gap:12px}
  h1{font-size:15px;margin:0}
  label{display:grid;gap:4px;font-size:12px;color:#bdbdbd}
  label b{color:#f2f2f2;font-weight:600}
  input[type=range]{width:100%}
  button{font:inherit;font-weight:600;background:#ffd23f;color:#1a1400;border:0;border-radius:8px;padding:10px;cursor:pointer}
  button:disabled{opacity:.6}
  .msg{font-size:12px;color:#bdbdbd;min-height:1em}
  .msg.err{color:#ff8a8a}
  kbd{background:#2a2a2a;border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Perfect Circle Bot</h1>
  <label for="wobble">Wobble <b id="wobbleVal">0</b>
    <input type="range" id="wobble" min="0" max="20" step="1" value="0">
  </label>
  <label for="speed">Draw time <b id="speedVal">0.9s</b>
    <input type="range" id="speed" min="300" max="3000" step="100" value="900">
  </label>
  <button id="draw">Draw circle</button>
  <div class="msg" id="msg">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></div>
</div>
<script src="popup.js"></script>
</body>
</html>
